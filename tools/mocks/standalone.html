<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mock · Standalone</title>
  <link rel="stylesheet" href="../mock-frame.css" />
</head>
<body>
  <div class="stage" id="capture">
    <div class="os-window compact">
      <div class="titlebar">
        <div class="traffic" aria-hidden="true"><span class="r"></span><span class="y"></span><span class="g"></span></div>
        <div class="titlebar-label">Open Terminal · standalone</div>
      </div>
      <div class="ot-tabs"><span class="ot-tab on">nu</span><span class="ot-tab">pwsh</span><span class="ot-tab">cmd</span></div>
      <div class="ot-term">
        <div class="dim">PS Z:\code&gt; nu</div>
        <div>~&gt; ls</div>
        <div>~&gt; cargo test</div>
      </div>
      <div class="footer"><span>Tabs + session in one window</span><span>Windows Terminal–like</span></div>
    </div>
  </div>
</body>
</html>
