<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mock · Nested zones</title>
  <link rel="stylesheet" href="../mock-frame.css" />
</head>
<body>
  <div class="stage" id="capture">
    <div class="os-window wide">
      <div class="titlebar">
        <div class="traffic" aria-hidden="true"><span class="r"></span><span class="y"></span><span class="g"></span></div>
        <div class="titlebar-label">Open Terminal · contained tiling zones</div>
      </div>
      <div class="zone-grid">
        <div class="zone-box">
          <div class="zone-label">Monitor 1</div>
          <div class="zone-tile"></div>
          <div class="zone-tile"></div>
        </div>
        <div class="zone-box dull">
          <div class="zone-label">Monitor 2</div>
          <div class="zone-tile empty"></div>
        </div>
      </div>
      <div class="footer"><span>Nested zones inside the app desk</span><span>not OS WM</span></div>
    </div>
  </div>
</body>
</html>
