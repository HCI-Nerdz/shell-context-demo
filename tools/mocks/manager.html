<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mock · Project manager</title>
  <link rel="stylesheet" href="../mock-frame.css" />
</head>
<body>
  <div class="stage" id="capture">
    <div class="manager-stage">
      <div class="os-window">
        <div class="titlebar">
          <div class="traffic" aria-hidden="true"><span class="r"></span><span class="y"></span><span class="g"></span></div>
          <div class="titlebar-label">Open Terminal · Project manager</div>
        </div>
        <div class="body-pane" style="display:grid;grid-template-columns:7rem 1fr;gap:.45rem;min-height:200px;">
          <div class="vrail">
            <div class="vgroup">SHELL-ARCHITECTURE</div>
            <div class="vtab on">nu build</div>
            <div class="vtab">docs preview</div>
            <div class="vgroup">DEVCENTR</div>
            <div class="vtab dull">app run</div>
          </div>
          <div class="cmd" style="padding-top:.35rem;">focused: nu build<br/>group: shell-architecture</div>
        </div>
      </div>
      <div class="os-window">
        <div class="titlebar">
          <div class="traffic" aria-hidden="true"><span class="r"></span><span class="y"></span><span class="g"></span></div>
          <div class="titlebar-label">DevCentr · project grid</div>
        </div>
        <div class="dc-grid">
          <div class="dc-cell on">shell-architecture<span class="dc-meta">2 sessions</span></div>
          <div class="dc-cell dull">devcentr<span class="dc-meta">2 sessions</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
