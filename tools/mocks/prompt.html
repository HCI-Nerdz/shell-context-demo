<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mock · Prompt desk</title>
  <link rel="stylesheet" href="../mock-frame.css" />
</head>
<body>
  <div class="stage" id="capture">
    <div class="os-window">
      <div class="titlebar">
        <div class="traffic" aria-hidden="true"><span class="r"></span><span class="y"></span><span class="g"></span></div>
        <div class="titlebar-label">Open Shell · desk · ~/code/shell-architecture</div>
      </div>
      <div class="topbar">
        <span class="brand">Open Shell</span><span class="sim">SIM</span>
        <span class="chip">Host chrome</span><span class="chip">2-line</span><span class="chip">ephemeral</span>
      </div>
      <div class="body-pane">
        <p class="hint">Context tokens above the live command line</p>
        <div class="context">
          <span class="token">gcloud: ftn</span><span class="token muted">user: rjamd</span>
          <span class="token muted">host: desk</span><span class="token">path: ~/code</span>
        </div>
        <div class="row"><span class="gutter">&gt;</span><span class="cmd">gcloud compute instances list</span></div>
      </div>
      <div class="footer"><span>Prompt desk</span><span>shell-context · facsimile</span></div>
    </div>
  </div>
</body>
</html>
